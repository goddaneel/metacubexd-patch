id: io.goddaneel.metacubexd
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: metacubexd




finish-args:
  - --share=network
  - --socket=wayland
  - --device=dri
  - --persist="."
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher




modules:
  - name: metacubexd
    buildsystem: simple
    build-commands:
      - install -v -d -m 0755 "/app"
      - install -v -d -m 0755 "/app/usr"
      - install -v -d -m 0755 "/app/share"
      - install -v -d -m 0755 "/app/opt"

      - cp -rv "./lib" "/app/usr"
      - cp -rv "./share/icons" "/app/share"
      - cp -rv "./MetaCubeXD" "/app/opt"

      - for _ls_loop in "/app/share/icons/hicolor/"* ; do mv -v "${_ls_loop}/apps/"{,"io.goddaneel."}metacubexd".png" ; done

      - chmod -c a+x "/app/opt/MetaCubeXD/chrome-sandbox"
      - chmod -c -R -P go-w "/app"



    sources:
      - type: archive
        url: https://github.com/MetaCubeX/metacubexd/releases/download/v1.271.0/MetaCubeXD-1.271.0-linux-x86_64.rpm
        sha256: 3ed8cc3b373b2d3c992d2bfb10ac70f30c5d1f71148329539400eff66c653a72




  - name: metacubexd-patch
    buildsystem: simple
    build-commands:
      - install -v -d -m 0755 "/app/bin"
      - install -v -d -m 0755 "/app/share/metainfo"
      - install -v -d -m 0755 "/app/share/doc"
      - install -v -d -m 0755 "/app/share/applications"

      - install -v -m 0755 "./flatpak/extra/bin/metacubexd" "/app/bin/"
      - install -v -m 0644 "./flatpak/extra/metainfo/io.goddaneel.metacubexd.metainfo.xml" "/app/share/metainfo/"
      - install -v -m 0644 "./flatpak/extra/applications/io.goddaneel.metacubexd.desktop" "/app/share/applications/"


    sources:
      - type: dir
        path: "../"